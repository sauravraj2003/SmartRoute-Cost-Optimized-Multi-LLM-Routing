# Tier is escalation/fallback rank, not a universal quality label. The policy
# chooses by predicted success and estimated request cost within these tiers.
pricing_date: "2026-10-25"

models:
  - id: "openai-gpt6-luna"
    display_name: "GPT-6 Luna (OpenAI)"
    tier: 1
    provider: openai
    endpoint: "https://api.openai.com/v1"
    model_name: "gpt-6-luna"
    context_window: 1050000
    long_context_threshold_tokens: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    supports_tools: false
    supports_vision: false
    input_cost_per_million_tokens: 0.05
    output_cost_per_million_tokens: 0.25
    enabled: true
    notes: "Lowest-cost configured model for short-context standard requests."

  - id: "groq-gpt-oss-20b"
    display_name: "GPT-OSS 20B (Groq)"
    tier: 2
    provider: groq
    endpoint: "https://api.groq.com/openai/v1"
    model_name: "openai/gpt-oss-20b"
    context_window: 131072
    supports_tools: false
    supports_vision: false
    input_cost_per_million_tokens: 0.075
    output_cost_per_million_tokens: 0.30
    enabled: true
    notes: "Open-weight model hosted on Groq; verify account availability."

  - id: "anthropic-claude-opus-5-5"
    display_name: "Claude Opus 5.5 (Anthropic)"
    tier: 3
    provider: anthropic
    endpoint: "https://api.anthropic.com"
    model_name: "claude-opus-5-5"
    context_window: 1000000
    supports_tools: false
    supports_vision: false
    input_cost_per_million_tokens: 4.00
    output_cost_per_million_tokens: 20.00
    enabled: true
    notes: "Highest configured tier; validate measured quality on held-out tasks."
