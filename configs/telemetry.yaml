# =============================================================================
# SmartRoute — Telemetry & Observability Configuration
# =============================================================================
# Controls OpenTelemetry tracing, logging, and metrics export.
# =============================================================================

# Service identity shown in trace spans
service_name: "smartroute-gateway"
service_version: "0.1.0"
environment: "development"         # development | staging | production

# =============================================================================
# OpenTelemetry Tracing
# =============================================================================

tracing:
  enabled: true

  # Exporter: "console" (local dev) | "otlp" (production collector)
  exporter: "console"

  # OTLP settings — only used when exporter = "otlp"
  otlp:
    endpoint: "http://localhost:4317"   # gRPC OTLP collector endpoint
    insecure: true                      # set false in production (use TLS)

  # Fraction of requests to sample (1.0 = 100%)
  sample_rate: 1.0

  # Span attributes attached to every gateway request trace
  span_attributes:
    - selected_model
    - predicted_success_tier1
    - predicted_success_tier2
    - predicted_success_tier3
    - actual_success
    - routing_mode
    - escalated
    - input_tokens
    - output_tokens
    - cost_usd
    - latency_ms

# =============================================================================
# Structured Logging
# =============================================================================

logging:
  level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  format: "json"                   # json | text
  output: "stdout"                 # stdout | file
  file_path: "logs/smartroute.log" # used only when output = "file"

  # Log a structured record for every routing decision
  log_routing_decisions: true

# =============================================================================
# Metrics (future — can wire to Prometheus)
# =============================================================================

metrics:
  enabled: false                   # flip to true when Prometheus is set up
  exporter: "prometheus"
  port: 9090
