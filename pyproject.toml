[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute"
version = "0.1.0"
description = "Cost-aware multi-LLM routing middleware for coding assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Your Name", email = "you@example.com" }
]

keywords = ["llm", "routing", "cost-optimization", "mlops", "coding-assistant"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# ── Core runtime dependencies ──────────────────────────────────────────────
dependencies = [
  # Web framework (gateway API)
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",

  # Data validation
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",

  # HTTP client (async, for calling model providers)
  "httpx>=0.27.0",

  # Config loading
  "pyyaml>=6.0.1",

  # ML / routing model
  "xgboost>=2.0.3",
  "scikit-learn>=1.4.2",
  "numpy>=1.26.4",
  "pandas>=2.2.2",

  # Feature extraction

  # Data storage
  "pyarrow>=16.0.0",       # Parquet I/O

  # Observability
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp>=1.24.0",

  # LLM provider SDKs
  "openai>=1.30.0",
  "anthropic>=0.28.0",

  # Utilities
  "tenacity>=8.3.0",       # retry with back-off
  "rich>=13.7.1",          # pretty CLI output
  "python-dotenv>=1.0.1",  # .env loading
  "typer>=0.12.3",         # CLI commands
  "datasets>=2.19.0",      # HumanEval / MBPP loading
]

# ── Optional / extra dependency groups ────────────────────────────────────
[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0.0",
  "httpx",                 # also used in tests for TestClient
  "ruff>=0.4.7",           # linter + formatter
  "mypy>=1.10.0",
  "types-PyYAML",
]

notebooks = [
  "jupyter>=1.0.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.2",
  "ipywidgets>=8.1.3",
]

# ── CLI entry-points ───────────────────────────────────────────────────────
[project.scripts]
smartroute = "gateway.api:run_server"

# ── Tool configuration ─────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "router*", "features*", "benchmark*", "data*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]   # handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
